services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: tremor_falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    environment:
      - FALKORDB_ARGS=--protected-mode no
    restart: unless-stopped

  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    container_name: tremor_browser
    ports:
      - "3000:3000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    depends_on:
      - falkordb
    restart: unless-stopped

volumes:
  falkordb_data:
